<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BODIK Data Viewer - UDC2025</title>
    <link rel="icon" href="./favicon.ico">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/map.css">
    <link rel="stylesheet" href="./css/components.css">
</head>

<body>

    <!-- ハンバーガーメニュー（container外に配置） -->
    <button id="menu-toggle" class="menu-toggle" aria-label="メニューを開く">&#9776;</button>
    <nav id="side-menu" class="side-menu">
        <button id="menu-close" class="menu-close" aria-label="メニューを閉じる">&times;</button>
        <div id="menu-content" class="menu-content">
            <div class="category-buttons">
                <button class="category-btn active" data-category="aed">AED</button>
                <button class="category-btn" data-category="hospital">医療機関</button>
                <button class="category-btn" data-category="freewifi">公衆無線LAN</button>
                <button class="category-btn" data-category="evacuation">指定緊急避難場所</button>
                <button class="category-btn" data-category="toilet">公衆トイレ</button>
            </div>
            <div class="control-buttons">
                <button id="favorites-btn" class="control-btn">❤️ お気に入り</button>
                <button id="current-location-btn" class="control-btn">📍 現在地を表示</button>
                <button id="refresh-btn" class="control-btn">🔄 更新</button>
            </div>
        </div>
        <div id="favorites-list-container" class="favorites-list-container hidden">
            <div class="favorites-list-header">
                <h3>❤️ お気に入り一覧</h3>
                <button id="favorites-back-btn" class="favorites-back-btn">← 戻る</button>
            </div>
            <div id="favorites-list" class="favorites-list">
                <!-- リストがここに表示される -->
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>BODIK Data Viewer</h1>
            <p class="subtitle">オープンデータを地図で見てみよう</p>
        </header>
        <!-- 地図表示エリア -->
        <div id="map" class="map-container"></div>

        <!-- ローディング表示 -->
        <div id="loading" class="loading hidden">
            <div class="loading-spinner"></div>
            <p>データを読み込み中...</p>
        </div>

        <!-- フッター -->
        <footer class="footer">
            <p>データ提供 : <a href="https://www.bodik.jp/project/bodik-api/" target="_blank"
                    rel="noopener">BODIK API</a></p>
            <p class="copyright">&copy; 2025 CODE for GIFU ものづくり部 BODIK Data Viewer チーム</p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- ハンバーガーメニュー制御用JS -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const sideMenu = document.getElementById('side-menu');
        const menuClose = document.getElementById('menu-close');

        menuToggle.addEventListener('click', () => {
            sideMenu.classList.add('open');
        });
        menuClose.addEventListener('click', () => {
            sideMenu.classList.remove('open');
            // メニュー閉じる時にお気に入りリストもリセット
            const menuContent = document.getElementById('menu-content');
            const favoritesListContainer = document.getElementById('favorites-list-container');
            if (menuContent && favoritesListContainer) {
                menuContent.classList.remove('hidden');
                favoritesListContainer.classList.add('hidden');
            }
        });
        // メニュー外クリックで閉じる
        document.addEventListener('click', (e) => {
            if (sideMenu.classList.contains('open') && !sideMenu.contains(e.target) && e.target !== menuToggle) {
                sideMenu.classList.remove('open');
                // メニュー閉じる時にお気に入りリストもリセット
                const menuContent = document.getElementById('menu-content');
                const favoritesListContainer = document.getElementById('favorites-list-container');
                if (menuContent && favoritesListContainer) {
                    menuContent.classList.remove('hidden');
                    favoritesListContainer.classList.add('hidden');
                }
            }
        });

        // カテゴリボタンをクリックしたらメニューを閉じる
        const categoryButtons = document.querySelectorAll('.category-btn');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                sideMenu.classList.remove('open');
                // メニュー閉じる時にお気に入りリストもリセット
                const menuContent = document.getElementById('menu-content');
                const favoritesListContainer = document.getElementById('favorites-list-container');
                if (menuContent && favoritesListContainer) {
                    menuContent.classList.remove('hidden');
                    favoritesListContainer.classList.add('hidden');
                }
            });
        });

        // 現在地と更新ボタンをクリックしたらメニューを閉じる
        const currentLocationBtn = document.getElementById('current-location-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        
        if (currentLocationBtn) {
            currentLocationBtn.addEventListener('click', () => {
                sideMenu.classList.remove('open');
                // メニュー閉じる時にお気に入りリストもリセット
                const menuContent = document.getElementById('menu-content');
                const favoritesListContainer = document.getElementById('favorites-list-container');
                if (menuContent && favoritesListContainer) {
                    menuContent.classList.remove('hidden');
                    favoritesListContainer.classList.add('hidden');
                }
            });
        }
        
        if (refreshBtn) {
            refreshBtn.addEventListener('click', () => {
                sideMenu.classList.remove('open');
                // メニュー閉じる時にお気に入りリストもリセット
                const menuContent = document.getElementById('menu-content');
                const favoritesListContainer = document.getElementById('favorites-list-container');
                if (menuContent && favoritesListContainer) {
                    menuContent.classList.remove('hidden');
                    favoritesListContainer.classList.add('hidden');
                }
            });
        }

        // お気に入りボタンはメニューを閉じない（中身を切り替える）
        // UIモジュールで処理される
    </script>

    <!-- Custom JS -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
